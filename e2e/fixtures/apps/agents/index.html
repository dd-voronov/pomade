<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agents (test)</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Agents (test)</h1>
      <span id="status" data-state="connecting">Connecting…</span>
    </header>
    <p id="route" class="muted"></p>
    <p><button type="button" id="launch">Launch Claude with a prompt</button> <span id="result" class="error"></span></p>
    <h2>Agent tabs</h2>
    <table id="tabs">
      <thead>
        <tr><th>Agent</th><th>Title</th><th>Session</th><th>State</th><th></th></tr>
      </thead>
      <tbody></tbody>
    </table>
    <h2>Closed sessions</h2>
    <table id="closed">
      <thead>
        <tr><th>Agent</th><th>Title</th><th>Session</th><th></th></tr>
      </thead>
      <tbody></tbody>
    </table>
    <script src="app.js"></script>
  </body>
</html>
